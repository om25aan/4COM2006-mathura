<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mathura - Login</title>
    <link rel="stylesheet" href="loginStyle.css" />
</head>
<body>

  <div class="container">
    <div class="left">
      <h1>Login</h1>
      <p class="subtitle">Hi, Welcome back!</p>

      <div class="social-buttons">
        <button class="google-btn">
          <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google">
          Login with Google
        </button>

        <button class="apple-btn">
          <img src="https://cdn-icons-png.flaticon.com/512/179/179309.png" alt="Apple">
          Login with Apple
        </button>
      </div>

      <div class="divider">
        <span>Or Login with Email</span>
      </div>

      <form>
        <div class="input-group">
          <input type="email" placeholder="Email" required>
        </div>

        <div class="input-group password">
            <input type="password" id="password" placeholder="Password" required>
            <span class="toggle-password" onclick="togglePassword()">
            </span>
        </div>
        <script>
            function togglePassword() {
                const passwordInput = document.getElementById("password");
                const toggleIcon = document.querySelector(".toggle-password");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleIcon.textContent = <i class="fa-regular fa-eye"></i>;
             }  else {
                passwordInput.type = "password";
                toggleIcon.textContent = <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M73 39.1C63.6 29.7 48.4 29.7 39.1 39.1C29.8 48.5 29.7 63.7 39 73.1L567 601.1C576.4 610.5 591.6 610.5 600.9 601.1C610.2 591.7 610.3 576.5 600.9 567.2L504.5 470.8C507.2 468.4 509.9 466 512.5 463.6C559.3 420.1 590.6 368.2 605.5 332.5C608.8 324.6 608.8 315.8 605.5 307.9C590.6 272.2 559.3 220.2 512.5 176.8C465.4 133.1 400.7 96.2 319.9 96.2C263.1 96.2 214.3 114.4 173.9 140.4L73 39.1zM236.5 202.7C260 185.9 288.9 176 320 176C399.5 176 464 240.5 464 320C464 351.1 454.1 379.9 437.3 403.5L402.6 368.8C415.3 347.4 419.6 321.1 412.7 295.1C399 243.9 346.3 213.5 295.1 227.2C286.5 229.5 278.4 232.9 271.1 237.2L236.4 202.5zM357.3 459.1C345.4 462.3 332.9 464 320 464C240.5 464 176 399.5 176 320C176 307.1 177.7 294.6 180.9 282.7L101.4 203.2C68.8 240 46.4 279 34.5 307.7C31.2 315.6 31.2 324.4 34.5 332.3C49.4 368 80.7 420 127.5 463.4C174.6 507.1 239.3 544 320.1 544C357.4 544 391.3 536.1 421.6 523.4L357.4 459.2z"/></svg>;
             }
            }
        </script>
        <div class="options">
          <label>
            <input type="checkbox">
            Remember Me
          </label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <p class="signup">
          Don't have an account? <a href="#">Sign up</a>
        </p>
      </form>
    </div>

    <div class="bingBong">
      <img src="purpleMuzzy1.png">
    </div>
  </div>

</body>
</html>
